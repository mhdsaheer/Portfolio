<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asymmetrical website design - Fold Studio (fictional)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700;800&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body { --stage: linear-gradient(140deg, #fff0f6 0%, #fff7e6 100%); background: var(--stage); }
  .browser { left: 90px; top: 64px; width: 1420px; height: 872px; }
  .page { background: #f4efe6; color: #1c1b17; font-family: "Inter", sans-serif; }

  nav { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 26px 48px; font-size: 14px; font-weight: 500; z-index: 3; }
  .logo { font: 800 26px "Unbounded"; letter-spacing: -0.04em; }
  .menu { display: flex; gap: 12px; align-items: center; }
  .menu i { display: block; width: 28px; height: 2px; background: #1c1b17; box-shadow: 0 7px 0 #1c1b17; transform: translateY(-3px); }
  .vertical { position: absolute; left: 22px; top: 380px; transform: rotate(-90deg); transform-origin: left top; font-size: 12px; letter-spacing: 0.3em; color: #6f6a5e; }

  /* The big image sits right of centre and runs off the top */
  .hero-img { position: absolute; left: 560px; top: 0; width: 640px; height: 520px; background: linear-gradient(160deg, #d9c2a5, #c99b74); overflow: hidden; }
  .hero-img .sun { position: absolute; left: 330px; top: 70px; width: 220px; height: 220px; border-radius: 50%; background: #e8643c; }
  .hero-img .arch { position: absolute; left: 90px; bottom: 0; width: 260px; height: 360px; border-radius: 130px 130px 0 0; background: #f4efe6; }
  .hero-img .arch2 { position: absolute; left: 150px; bottom: 0; width: 140px; height: 220px; border-radius: 70px 70px 0 0; background: #6b7d4c; }
  .hero-img .slab { position: absolute; right: -40px; bottom: 60px; width: 300px; height: 60px; background: #1c1b17; transform: rotate(-12deg); }

  /* The headline overlaps the image's left edge */
  h1 { position: absolute; left: 96px; top: 210px; width: 720px; font: 700 78px/0.98 "Unbounded"; letter-spacing: -0.05em; z-index: 2; }
  h1 em { font: italic 400 96px/0.9 "Instrument Serif"; letter-spacing: -0.01em; color: #e8643c; }
  h1 .over { color: #fff; mix-blend-mode: normal; }

  .small-img { position: absolute; left: 150px; top: 560px; width: 270px; height: 250px; background: #6b7d4c; transform: rotate(-4deg); overflow: hidden; }
  .small-img::before { content: ""; position: absolute; left: 40px; top: 50px; width: 190px; height: 190px; border-radius: 50%; background: #e9d8b9; }
  .small-img::after { content: ""; position: absolute; left: 90px; top: 0; width: 90px; height: 160px; background: #1c1b17; border-radius: 0 0 45px 45px; }
  .block { position: absolute; left: 380px; top: 690px; width: 170px; height: 120px; background: #e8643c; }

  .label { position: absolute; left: 600px; top: 600px; font: 500 13px "Inter"; letter-spacing: 0.14em; text-transform: uppercase; color: #6f6a5e; }
  .text { position: absolute; left: 820px; top: 590px; width: 380px; font-size: 17px; line-height: 1.6; color: #3b382f; }
  .text a { display: inline-flex; gap: 10px; margin-top: 18px; padding-bottom: 4px; border-bottom: 2px solid #1c1b17; color: #1c1b17; font-weight: 600; }
  .count { position: absolute; right: 52px; top: 120px; font: 800 120px/1 "Unbounded"; color: transparent; -webkit-text-stroke: 1.5px #1c1b17; letter-spacing: -0.06em; }
  .count small { display: block; margin-top: 6px; font: 500 13px "Inter"; -webkit-text-stroke: 0; color: #6f6a5e; letter-spacing: 0.04em; text-align: right; }

  .badge { position: absolute; left: 1120px; top: 420px; width: 170px; height: 170px; border-radius: 50%; background: #1c1b17; display: grid; place-items: center; z-index: 3; }
  .badge svg { position: absolute; inset: 10px; width: 150px; height: 150px; }
  .badge b { width: 44px; height: 44px; border-radius: 50%; background: #e8643c; }
  .tiny { position: absolute; left: 1250px; top: 650px; width: 110px; height: 150px; background: #c99b74; transform: rotate(6deg); }
</style>
</head>
<body>
  <div class="browser">
    <div class="chrome"><i></i><i></i><i></i><div class="url">fold.studio</div></div>
    <div class="page">
      <nav><span class="logo">fold/</span><span class="menu">Menu <i></i></span></nav>
      <span class="vertical">SCROLL &mdash; EST. 2019 &mdash; LISBON</span>

      <div class="hero-img"><span class="sun"></span><span class="arch"></span><span class="arch2"></span><span class="slab"></span></div>
      <div class="count">07<small>new projects this year</small></div>

      <h1>We shape brands that refuse to sit <em>still.</em></h1>

      <div class="badge">
        <svg viewBox="0 0 150 150"><defs><path id="c" d="M75 75 m -58 0 a 58 58 0 1 1 116 0 a 58 58 0 1 1 -116 0"/></defs><text font-family="Inter" font-size="12.5" font-weight="600" letter-spacing="3.2" fill="#f4efe6"><textPath href="#c">FOLD STUDIO &#8226; CREATIVE AGENCY &#8226; </textPath></text></svg>
        <b></b>
      </div>

      <div class="small-img"></div>
      <div class="block"></div>
      <span class="label">(01) &mdash; Selected work</span>
      <p class="text">Identity, campaigns and websites for brands in food, fashion and culture. We work best with people who want to be noticed.<br><a>See our work &rarr;</a></p>
      <div class="tiny"></div>
    </div>
  </div>
</body>
</html>
